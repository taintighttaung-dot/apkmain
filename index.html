
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1">
<title>ပင်မ - မုန့်မူရင်းစာရင်း</title>

<style>
*{
 box-sizing:border-box;
}

[hidden]{
 display:none!important;
}

body{
 margin:0;
 padding:15px;
 background:#f3f6f4;
 color:#263b32;
 font-family:Arial,sans-serif;
}

.container{
 max-width:650px;
 margin:auto;
}

.header{
 background:#176b51;
 color:white;
 text-align:center;
 padding:24px 16px;
 border-radius:18px;
 margin-bottom:18px;
}

.header h2{
 margin:0 0 8px;
}

.header p{
 margin:0;
 font-size:14px;
}

.card{
 background:white;
 border-radius:18px;
 padding:19px;
 margin-bottom:18px;
 box-shadow:0 4px 15px #0000000d;
}

.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}

h3{
 margin:0 0 12px;
}

label{
 display:block;
 margin:14px 0 7px;
 color:#52645a;
 font-size:14px;
}

input{
 width:100%;
 min-width:0;
 padding:13px;
 border:1px solid #d2ddd6;
 border-radius:11px;
 background:white;
 font-size:16px;
 outline:none;
}

input:focus{
 border-color:#176b51;
 box-shadow:0 0 0 2px #c2e6d2;
}

.grid{
 display:grid;
 grid-template-columns:
  minmax(0,1fr) minmax(0,1fr);
 gap:12px;
}

button{
 cursor:pointer;
 font-size:15px;
 font-weight:bold;
 border-radius:11px;
 padding:15px;
}

button:disabled{
 opacity:.65;
 cursor:wait;
}

.primary{
 width:100%;
 background:#176b51;
 color:white;
 border:0;
}

.add{
 width:100%;
 background:white;
 color:#176b51;
 border:2px dashed #176b51;
}

.delete{
 background:#fff0f0;
 color:#c62828;
 border:0;
 padding:11px 13px;
}

.status{
 margin:12px 0;
 font-size:14px;
 line-height:1.6;
 overflow-wrap:anywhere;
}

.success{
 color:#176b51;
}

.error{
 color:#c62828;
}

.small{
 color:#64766b;
 font-size:13px;
 line-height:1.6;
}

.info{
 background:#e8f5ee;
 padding:15px;
 border-radius:12px;
 margin-top:15px;
}

.line{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
 padding:10px 0;
 border-bottom:1px solid #d4e5db;
}

.line:last-child{
 border-bottom:0;
}

.line strong{
 text-align:right;
 overflow-wrap:anywhere;
}

.sticky{
 position:sticky;
 bottom:8px;
 z-index:10;
 padding:12px;
 background:#ffffffed;
 border-radius:15px;
 box-shadow:0 4px 15px #0002;
 margin-bottom:18px;
}

.summary{
 background:#176b51;
 color:white;
 padding:20px;
 border-radius:18px;
 margin-bottom:18px;
}

.summary .line{
 border-color:#ffffff35;
}

.warning{
 color:#ae6500;
 font-size:13px;
}

@media(max-width:350px){
 .grid{
  grid-template-columns:1fr;
 }
}
</style>
</head>

<body>
<div class="container">

<!-- Header -->

<div class="header">
 <h2>ပင်မ</h2>
 <p>မုန့်အမျိုးအစားနှင့် မူရင်းစာရင်း</p>
</div>

<!-- Loading -->

<div id="loading" class="card">
 Firebase ချိတ်ဆက်နေပါသည်...
</div>

<!-- Login -->

<div id="loginBox" class="card" hidden>

 <h3>ပင်မ Account ဝင်ရန်</h3>

 <form id="loginForm">

  <label for="email">Email</label>

  <input
   id="email"
   type="email"
   autocomplete="username"
   required>

  <label for="password">Password</label>

  <input
   id="password"
   type="password"
   autocomplete="current-password"
   required>

  <button
   type="submit"
   class="primary"
   style="margin-top:16px">
   Login ဝင်မည်
  </button>

 </form>

 <p id="loginStatus"
  class="status"></p>

</div>

<!-- Main -->

<div id="appBox" hidden>

<div class="card">

 <h3>ပင်မ မုန့်စာရင်း</h3>

 <div id="account" class="small"></div>

 <p id="connection" class="status"></p>

 <p class="small">
  မုန့်အမျိုးအစား အရေအတွက်
  ကန့်သတ်မထားပါ။
  ရှိသလောက် ထည့်နိုင်ပါသည်။
 </p>

</div>

<!-- Items -->

<div id="items"></div>

<!-- Add Button -->

<div class="card">

 <button
  id="addBtn"
  class="add">
  + မုန့်အမျိုးအစား ထပ်ထည့်ရန်
 </button>

</div>

<!-- Summary -->

<div class="summary">

 <h3>မူရင်းစာရင်းချုပ်</h3>

 <div class="line">
  <span>မုန့်အမျိုးအစားစုစုပေါင်း</span>
  <strong id="totalTypes">0 မျိုး</strong>
 </div>

 <div class="line">
  <span>မူရင်းအထုပ်စုစုပေါင်း</span>
  <strong id="totalQty">0 ထုပ်</strong>
 </div>

 <div class="line">
  <span>မူရင်းတန်ဖိုးစုစုပေါင်း</span>
  <strong id="totalValue">0 ကျပ်</strong>
 </div>

</div>

<!-- Save -->

<div class="sticky">

 <button
  id="saveBtn"
  class="primary">
  💾 Save မည်
 </button>

 <p
  id="saveStatus"
  class="status"
  role="status">
 </p>

</div>

</div>
</div>

<!-- Firebase Error Detection -->

<script>
window.addEventListener(
 "error",
 function(e){

  var loading =
   document.getElementById("loading");

  if(loading && !loading.hidden){

   loading.textContent =
    "JavaScript Error: " +
    (e.message || "Unknown error");

   loading.className = "card error";
  }
 }
);
</script>

<!-- Firebase SDK -->

<script
 src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js">
</script>

<script
 src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js">
</script>

<script
 src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js">
</script>

<script>
(function(){
"use strict";

/* Elements */

var $ = function(id){
 return document.getElementById(id);
};

/* SDK Check */

if(
 !window.firebase ||
 !firebase.auth ||
 !firebase.database
){

 $("loading").textContent =
  "Firebase SDK မဖွင့်နိုင်ပါ။ Internet စစ်ပါ။";

 $("loading").className =
  "card error";

 return;
}

/* Firebase Configuration */

var firebaseConfig = {

 apiKey:
  "AIzaSyAZK7ntdtiSDZ9eC6eAr3xKDK_DGJnNVVU",

 authDomain:
  "seller-b4dfa.firebaseapp.com",

 databaseURL:
  "https://seller-b4dfa-default-rtdb.firebaseio.com",

 projectId:
  "seller-b4dfa",

 storageBucket:
  "seller-b4dfa.firebasestorage.app",

 messagingSenderId:
  "632319829206",

 appId:
  "1:632319829206:web:ae8ea88684ccb061311577",

 measurementId:
  "G-56VDJH0YVJ"

};

/* Initialize */

var app;

try{

 app = firebase.app("mainSellerApp");

}catch(e){

 app = firebase.initializeApp(
  firebaseConfig,
  "mainSellerApp"
 );

}

var auth = app.auth();

var db = app.database();

/*
 Shared Catalog
 Seller 1 နှင့် Seller 2 တို့
 ဒီစာရင်းကို ဖတ်မည်။
*/

var catalogRef = db.ref("catalog");

var items = [];

var revision = 0;

var ready = false;
var dirty = false;
var saving = false;
var connected = false;
var conflict = false;

var unsubscribe = null;
var connectionCallback = null;

/* Helpers */

function fresh(){

 return {

  id:
   "p_" +
   Date.now().toString(36) +
   Math.random().toString(36).slice(2),

  name:"",

  baseQty:"",

  baseCost:""

 };

}

/* Normalize */

function normalize(arr){

 if(!Array.isArray(arr)){
  return [];
 }

 return arr
 .filter(function(x){

  return x &&
   typeof x === "object";

 })
 .map(function(x){

  return {

   id:String(
    x.id || fresh().id
   ),

   name:String(
    x.name || ""
   ),

   baseQty:String(
    x.baseQty != null
     ? x.baseQty
     : x.qty != null
     ? x.qty
     : ""
   ),

   baseCost:String(
    x.baseCost != null
     ? x.baseCost
     : x.cost != null
     ? x.cost
     : ""
   )

  };

 });

}

/* Number */

function num(v){

 var n = Number(v);

 return isFinite(n)
  ? Math.max(0,n)
  : 0;

}

/* Format */

function fmt(v){

 return Number(v).toLocaleString(
  "en-US",
  {
   maximumFractionDigits:2
  }
 );

}

function money(v){

 return fmt(v) + " ကျပ်";

}

function packet(v){

 return fmt(v) + " ထုပ်";

}

/* Status */

function message(text,error){

 $("saveStatus").textContent = text;

 $("saveStatus").className =
  "status " +
  (error ? "error" : "success");

}

/* Mark Changed */

function changed(){

 dirty = true;

 message(
  "စာရင်းပြင်ဆင်ထားပါသည်။ Save နှိပ်ပါ။"
 );

}

/* Input Field */

function inputRow(
 item,
 key,
 labelText,
 type
){

 var box = document.createElement("div");

 var label = document.createElement("label");

 var input = document.createElement("input");

 label.textContent = labelText;

 input.type = type;

 input.value = item[key];

 if(type === "number"){

  input.min = "0";

  input.step =
   key === "baseQty"
   ? "1"
   : "any";

 }

 input.oninput = function(){

  item[key] = input.value;

  changed();

  calculate();

 };

 box.appendChild(label);

 box.appendChild(input);

 return box;

}

/* Render Items */

function render(){

 var area = $("items");

 area.innerHTML = "";

 items.forEach(function(item,index){

  var card =
   document.createElement("div");

  card.className = "card";

  var top =
   document.createElement("div");

  top.className = "top";

  var title =
   document.createElement("h3");

  title.textContent =
   "စဉ် " + (index+1);

  var del =
   document.createElement("button");

  del.className = "delete";

  del.textContent = "ဖျက်ရန်";

  del.onclick = function(){

   if(!confirm(
    "ဒီမုန့်အမျိုးအစားကို ဖျက်မှာ သေချာပါသလား။"
   )){
    return;
   }

   items = items.filter(
    function(x){

     return x.id !== item.id;

    }
   );

   changed();

   render();

  };

  top.appendChild(title);

  top.appendChild(del);

  var grid =
   document.createElement("div");

  grid.className = "grid";

  grid.appendChild(
   inputRow(
    item,
    "baseQty",
    "မူရင်းအထုပ်",
    "number"
   )
  );

  grid.appendChild(
   inputRow(
    item,
    "baseCost",
    "တစ်ထုပ်မူရင်းဈေး (ကျပ်)",
    "number"
   )
  );

  card.appendChild(top);

  card.appendChild(
   inputRow(
    item,
    "name",
    "မုန့်အမျိုးအစား",
    "text"
   )
  );

  card.appendChild(grid);

  area.appendChild(card);

 });

 calculate();

}

/* Summary */

function calculate(){

 var totalQty = 0;

 var totalValue = 0;

 var totalTypes = 0;

 items.forEach(function(item){

  if(
   String(item.name).trim() !== ""
  ){
   totalTypes++;
  }

  var qty = num(item.baseQty);

  var cost = num(item.baseCost);

  totalQty += qty;

  totalValue += qty * cost;

 });

 $("totalTypes").textContent =
  totalTypes + " မျိုး";

 $("totalQty").textContent =
  packet(totalQty);

 $("totalValue").textContent =
  money(totalValue);

}

/* Add Item */

$("addBtn").onclick = function(){

 if(!ready || saving){
  return;
 }

 items.push(fresh());

 changed();

 render();

};

/* Login */

$("loginForm").onsubmit = function(e){

 e.preventDefault();

 var button =
  this.querySelector("button");

 button.disabled = true;

 $("loginStatus").textContent =
  "Login ဝင်နေပါသည်...";

 auth.signInWithEmailAndPassword(

  $("email").value.trim(),

  $("password").value

 ).then(function(){

  $("password").value = "";

  $("loginStatus").textContent = "";

 }).catch(function(error){

  $("loginStatus").textContent =
   error.code || error.message;

 }).then(function(){

  button.disabled = false;

 });

};

/* Show Cloud Data */

function showCloud(data){

 revision = Number(
  data && data.revision
 ) || 0;

 items = normalize(
  data && data.items
 );

 if(!items.length){

  items = [fresh()];

 }

 ready = true;

 dirty = false;

 conflict = false;

 render();

}

/* Authentication */

auth.onAuthStateChanged(
 function(user){

  if(unsubscribe){

   unsubscribe();

   unsubscribe = null;

  }

  if(connectionCallback){

   db.ref(".info/connected")
    .off(
     "value",
     connectionCallback
    );

   connectionCallback = null;

  }

  ready = false;

  dirty = false;

  conflict = false;

  connected = false;

  revision = 0;

  $("loading").hidden = true;

  if(!user){

   $("loginBox").hidden = false;

   $("appBox").hidden = true;

   return;

  }

  $("loginBox").hidden = true;

  $("appBox").hidden = false;

  $("account").textContent =
   user.email;

  message(
   "Online မူရင်းစာရင်း ဖတ်နေပါသည်..."
  );

  connectionCallback =
   function(snapshot){

    connected =
     snapshot.val() === true;

    $("connection").textContent =
     connected
     ? "● Firebase Online ချိတ်ဆက်ထားသည်"
     : "● Firebase ချိတ်ဆက်မှု မရှိပါ";

   };

  db.ref(".info/connected").on(
   "value",
   connectionCallback
  );

  var callback = function(snapshot){

   var data = snapshot.val();

   var remote = Number(
    data && data.revision
   ) || 0;

   if(!ready){

    showCloud(data);

    message(
     "မူရင်းစာရင်း ရရှိပြီးပါပြီ။"
    );

    return;

   }

   if(saving){
    return;
   }

   if(dirty){

    if(remote !== revision){

     conflict = true;

     message(
      "အခြားဖုန်းမှ စာရင်းပြောင်းထားပါသည်။ " +
      "Refresh လုပ်ပြီး ပြန်စစ်ပါ။",
      true
     );

    }

    return;

   }

   showCloud(data);

  };

  catalogRef.on(
   "value",
   callback,
   function(error){

    message(
     "Database Error: " +
     (error.code || error.message),
     true
    );

   }
  );

  unsubscribe = function(){

   catalogRef.off(
    "value",
    callback
   );

  };

 }
);

/* Online Save */

$("saveBtn").onclick = async function(){

 if(saving){
  return;
 }

 if(!ready || !connected){

  message(
   "Firebase ချိတ်ဆက်မှုကို စစ်ဆေးပါ။",
   true
  );

  return;

 }

 if(conflict){

  message(
   "အခြားဖုန်းမှာ စာရင်းပြောင်းထားပါသည်။ " +
   "Refresh လုပ်ပြီး ပြန်စစ်ပါ။",
   true
  );

  return;

 }

 var clean = items.filter(
  function(x){

   return x.name.trim() !== "";

  }
 );

 /* Validate */

 var names = {};

 for(
  var i=0;
  i<clean.length;
  i++
 ){

  var x = clean[i];

  var key =
   x.name.trim().toLowerCase();

  if(names[key]){

   message(
    "မုန့်အမည် ထပ်နေပါသည်။",
    true
   );

   return;

  }

  names[key] = true;

  var qty = Number(x.baseQty);

  var cost = Number(x.baseCost);

  if(
   !isFinite(qty) ||
   qty < 0 ||
   !Number.isInteger(qty) ||
   !isFinite(cost) ||
   cost < 0
  ){

   message(
    "မူရင်းအထုပ်နှင့် မူရင်းဈေးကို စစ်ဆေးပါ။",
    true
   );

   return;

  }

 }

 saving = true;

 $("saveBtn").disabled = true;

 message(
  "Firebase Online Database ထဲ သိမ်းနေပါသည်..."
 );

 var expected = revision;

 var payload = JSON.parse(
  JSON.stringify(clean)
 );

 try{

  var result =
   await catalogRef.transaction(

    function(current){

     var currentRev =
      Number(
       current && current.revision
      ) || 0;

     if(
      currentRev !== expected
     ){
      return;
     }

     return {

      revision:
       currentRev + 1,

      items:payload,

      updatedAt:Date.now()

     };

    },

    undefined,

    false

   );

  if(!result.committed){

   conflict = true;

   message(
    "အခြားဖုန်းမှာ စာရင်းပြောင်းထားသဖြင့် Save မလုပ်ခဲ့ပါ။",
    true
   );

  }else{

   showCloud(
    result.snapshot.val()
   );

   message(
    "✓ Save ပြီးပါပြီ။ " +
    "အရောင်း ၁ နှင့် အရောင်း ၂ တွင် " +
    "မုန့်စာရင်း အလိုအလျောက်ပေါ်ပါမည်။"
   );

  }

 }catch(error){

  message(
   "Save Error: " +
   (error.code || error.message),
   true
  );

 }finally{

  saving = false;

  $("saveBtn").disabled = false;

 }

};

/* Unsaved Warning */

window.addEventListener(
 "beforeunload",
 function(e){

  if(dirty){

   e.preventDefault();

   e.returnValue = "";

  }

 }
);

})();
</script>

</body>
</html>
