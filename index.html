
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1">

<title>ပင်မ - မုန့်မူရင်းစာရင်း</title>

<style>
*{box-sizing:border-box}
[hidden]{display:none!important}

body{
 margin:0;
 padding:15px;
 background:#f3f6f4;
 color:#263b32;
 font-family:Arial,sans-serif;
}

.container{
 max-width:650px;
 margin:auto;
 padding-bottom:25px;
}

.header{
 background:#176b51;
 color:white;
 text-align:center;
 padding:24px 16px;
 border-radius:18px;
 margin-bottom:18px;
}

.header h2{margin:0 0 8px}
.header p{margin:0;font-size:14px}

.card{
 background:white;
 border-radius:18px;
 padding:19px;
 margin-bottom:18px;
 box-shadow:0 4px 15px #0000000d;
}

/* Main Account Header */

.account-row{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
 flex-wrap:wrap;
}

.account-row h3{
 margin:0;
}

.account-email{
 color:#65786d;
 font-size:13px;
 overflow-wrap:anywhere;
 text-align:right;
}

/* Firebase Connection */

.connection-row{
 display:flex;
 align-items:center;
 gap:10px;
 margin-top:22px;
 font-size:16px;
 font-weight:bold;
}

.connection-dot{
 width:12px;
 height:12px;
 border-radius:50%;
 background:#999;
 flex-shrink:0;
}

.connection-dot.online{
 background:#18b65d;
 animation:blink 1.2s infinite;
 box-shadow:0 0 7px #18b65d;
}

.connection-dot.offline{
 background:#e53935;
 animation:none;
 box-shadow:none;
}

@keyframes blink{
 0%,100%{
  opacity:1;
  box-shadow:0 0 9px #18b65d;
 }
 50%{
  opacity:.3;
  box-shadow:0 0 2px #18b65d;
 }
}

#connectionText.online{
 color:#176b51;
}

#connectionText.offline{
 color:#c62828;
}

/* Voucher Buttons */

.voucher-links{
 margin-top:24px;
 border-top:1px solid #e1e9e3;
 padding-top:20px;
}

.voucher-links h3{
 margin:0 0 15px;
 font-size:18px;
}

.voucher-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}

.voucher-btn{
 display:flex;
 align-items:center;
 justify-content:center;
 text-decoration:none;
 text-align:center;
 padding:17px 8px;
 border-radius:12px;
 background:#176b51;
 color:white;
 font-size:16px;
 font-weight:bold;
 min-height:60px;
}

.voucher-btn:active{
 background:#11543f;
}

/* Product Cards */

.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
}

h3{margin:0 0 12px}

label{
 display:block;
 margin:14px 0 7px;
 font-size:14px;
 color:#52645a;
}

input{
 width:100%;
 min-width:0;
 padding:13px;
 border:1px solid #d2ddd6;
 border-radius:11px;
 background:white;
 color:#263b32;
 font-size:16px;
 outline:none;
}

input:focus{
 border-color:#176b51;
 box-shadow:0 0 0 2px #c2e6d2;
}

.grid{
 display:grid;
 grid-template-columns:
  minmax(0,1fr) minmax(0,1fr);
 gap:12px;
}

button{
 padding:15px;
 border-radius:11px;
 font-size:15px;
 font-weight:bold;
 cursor:pointer;
}

button:disabled{
 opacity:.65;
 cursor:wait;
}

.primary{
 width:100%;
 background:#176b51;
 color:white;
 border:0;
}

.add{
 width:100%;
 background:white;
 color:#176b51;
 border:2px dashed #176b51;
}

.delete{
 background:#fff0f0;
 color:#c62828;
 border:0;
 padding:11px 13px;
}

.status{
 font-size:14px;
 line-height:1.6;
 margin:12px 0;
 color:#176b51;
 overflow-wrap:anywhere;
}

.error{color:#c62828}

.summary{
 background:#176b51;
 color:white;
 padding:20px;
 border-radius:18px;
 margin:20px 0;
}

.line{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
 padding:12px 0;
 border-bottom:1px solid #ffffff35;
}

.line:last-child{
 border-bottom:0;
}

.line strong{
 text-align:right;
 overflow-wrap:anywhere;
}

.sticky{
 position:sticky;
 bottom:8px;
 z-index:10;
 padding:12px;
 border-radius:15px;
 background:#ffffffef;
 box-shadow:0 4px 15px #0002;
 margin-bottom:18px;
}

.sticky button{
 min-height:56px;
 font-size:17px;
}

@media(max-width:350px){
 .grid{
  grid-template-columns:1fr;
 }
 .voucher-grid{
  grid-template-columns:1fr;
 }
}
</style>
</head>

<body>
<div class="container">

<!-- MAIN TITLE -->

<div class="header">
 <h2>ပင်မ</h2>
 <p>မုန့်အမျိုးအစားနှင့် မူရင်းစာရင်း</p>
</div>

<!-- LOADING -->

<div id="loading" class="card">
 Firebase ချိတ်ဆက်နေပါသည်...
</div>

<!-- LOGIN -->

<div id="loginBox" class="card" hidden>

 <h3>ပင်မ Account ဝင်ရန်</h3>

 <form id="loginForm">

  <label>Email</label>
  <input
   id="email"
   type="email"
   autocomplete="username"
   required>

  <label>Password</label>
  <input
   id="password"
   type="password"
   autocomplete="current-password"
   required>

  <button
   type="submit"
   class="primary"
   style="margin-top:16px">
   Login ဝင်မည်
  </button>

 </form>

 <p id="loginStatus" class="status"></p>

</div>

<!-- MAIN APP -->

<div id="appBox" hidden>

<!-- ACCOUNT AND VOUCHERS -->

<div class="card">

 <div class="account-row">

  <h3>ပင်မ မုန့်စာရင်း</h3>

  <div id="account"
   class="account-email">
  </div>

 </div>

 <!-- CONNECTED INDICATOR -->

 <div class="connection-row">

  <span
   id="connectionDot"
   class="connection-dot">
  </span>

  <span id="connectionText">
   Connecting...
  </span>

 </div>

 <!-- VOUCHER LINKS -->

 <div class="voucher-links">

  <h3>ဘောင်ချာများ ကြည့်ရန်</h3>

  <div class="voucher-grid">

   <a
    class="voucher-btn"
    href="firstseller.html#voucher">
    အရောင်း ၁
   </a>

   <a
    class="voucher-btn"
    href="secondseller.html#voucher">
    အရောင်း ၂
   </a>

  </div>

 </div>

</div>

<!-- PRODUCT ITEMS -->

<div id="items"></div>

<!-- ADD PRODUCT -->

<div class="card">

 <button id="addBtn" class="add">
  + မုန့်အမျိုးအစား ထပ်ထည့်ရန်
 </button>

</div>

<!-- SUMMARY -->

<div class="summary">

 <h3>မူရင်းစာရင်းချုပ်</h3>

 <div class="line">
  <span>မုန့်အမျိုးအစားစုစုပေါင်း</span>
  <strong id="totalTypes">0 မျိုး</strong>
 </div>

 <div class="line">
  <span>မူရင်းအထုပ်စုစုပေါင်း</span>
  <strong id="totalQty">0 ထုပ်</strong>
 </div>

 <div class="line">
  <span>မူရင်းတန်ဖိုးစုစုပေါင်း</span>
  <strong id="totalValue">0 ကျပ်</strong>
 </div>

</div>

<!-- SAVE -->

<div class="sticky">

 <button id="saveBtn" class="primary">
  💾 Save မည်
 </button>

 <p id="saveStatus"
  class="status"
  role="status"></p>

</div>

</div>
</div>

<!-- FIREBASE SDK -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<script>
(function(){
"use strict";

/* HELPER */

var $=function(id){
 return document.getElementById(id);
};

/* FIREBASE CHECK */

if(!window.firebase||
 !firebase.auth||
 !firebase.database){

 $("loading").textContent=
  "Firebase SDK မဖွင့်နိုင်ပါ။ Internet စစ်ပါ။";

 $("loading").className="card error";
 return;
}

/* FIREBASE CONFIG */

var firebaseConfig={
 apiKey:"AIzaSyAZK7ntdtiSDZ9eC6eAr3xKDK_DGJnNVVU",
 authDomain:"seller-b4dfa.firebaseapp.com",
 databaseURL:"https://seller-b4dfa-default-rtdb.firebaseio.com",
 projectId:"seller-b4dfa",
 storageBucket:"seller-b4dfa.firebasestorage.app",
 messagingSenderId:"632319829206",
 appId:"1:632319829206:web:ae8ea88684ccb061311577",
 measurementId:"G-56VDJH0YVJ"
};

/* INITIALIZE */

var app;

try{
 app=firebase.app("mainSellerApp");
}catch(e){
 app=firebase.initializeApp(
  firebaseConfig,
  "mainSellerApp"
 );
}

var auth=app.auth();
var db=app.database();

var catalogRef=db.ref("catalog");

/* VARIABLES */

var items=[];
var revision=0;

var ready=false;
var dirty=false;
var saving=false;
var connected=false;
var conflict=false;

var unsubscribe=null;
var connectionCallback=null;
var session=0;

/* NEW PRODUCT */

function fresh(){
 return {
  id:"p_"+Date.now().toString(36)+
   Math.random().toString(36).slice(2),
  name:"",
  baseQty:"",
  baseCost:""
 };
}

/* NORMALIZE CATALOG */

function normalize(arr){

 if(!Array.isArray(arr)){
  return [];
 }

 return arr.filter(function(x){
  return x&&typeof x==="object";
 }).map(function(x){

  return {
   id:String(x.id||fresh().id),

   name:String(x.name||""),

   baseQty:String(
    x.baseQty!=null?x.baseQty:
    x.qty!=null?x.qty:""
   ),

   baseCost:String(
    x.baseCost!=null?x.baseCost:
    x.cost!=null?x.cost:""
   )
  };

 });
}

/* NUMBER HELPERS */

function num(v){
 var n=Number(v);
 return isFinite(n)?Math.max(0,n):0;
}

function fmt(v){
 return Number(v).toLocaleString(
  "en-US",
  {maximumFractionDigits:2}
 );
}

function money(v){
 return fmt(v)+" ကျပ်";
}

function packet(v){
 return fmt(v)+" ထုပ်";
}

/* STATUS */

function message(text,error){

 $("saveStatus").textContent=text;

 $("saveStatus").className=
  "status"+(error?" error":"");
}

/* CONNECTION DISPLAY */

function showConnection(isOnline){

 connected=isOnline;

 var dot=$("connectionDot");
 var label=$("connectionText");

 if(isOnline){

  dot.className="connection-dot online";

  label.className="online";

  label.textContent="Connected";

 }else{

  dot.className="connection-dot offline";

  label.className="offline";

  label.textContent="Disconnected";

 }
}

/* DATA CHANGED */

function changed(){

 dirty=true;

 message(
  "ပြင်ဆင်ထားပါသည်။ Save နှိပ်ပါ။"
 );
}

/* INPUT FIELD */

function inputRow(item,key,labelText,type){

 var box=document.createElement("div");
 var label=document.createElement("label");
 var input=document.createElement("input");

 label.textContent=labelText;

 input.type=type;
 input.value=item[key];

 if(type==="number"){

  input.min="0";

  input.step=
   key==="baseQty"?"1":"any";
 }

 input.oninput=function(){

  item[key]=this.value;

  changed();
  calculate();
 };

 box.appendChild(label);
 box.appendChild(input);

 return box;
}

/* RENDER ITEMS */

function render(){

 var area=$("items");

 area.innerHTML="";

 items.forEach(function(item,index){

  var card=document.createElement("div");
  card.className="card";

  var top=document.createElement("div");
  top.className="top";

  var title=document.createElement("h3");
  title.textContent="စဉ် "+(index+1);

  var del=document.createElement("button");

  del.className="delete";
  del.textContent="ဖျက်ရန်";

  del.onclick=function(){

   if(!confirm(
    "ဒီမုန့်အမျိုးအစားကို ဖျက်မှာ သေချာပါသလား။"
   ))return;

   items=items.filter(function(x){
    return x.id!==item.id;
   });

   changed();
   render();
  };

  top.appendChild(title);
  top.appendChild(del);

  var grid=document.createElement("div");
  grid.className="grid";

  grid.appendChild(
   inputRow(
    item,
    "baseQty",
    "မူရင်းအထုပ်",
    "number"
   )
  );

  grid.appendChild(
   inputRow(
    item,
    "baseCost",
    "တစ်ထုပ်မူရင်းဈေး (ကျပ်)",
    "number"
   )
  );

  card.appendChild(top);

  card.appendChild(
   inputRow(
    item,
    "name",
    "မုန့်အမျိုးအစား",
    "text"
   )
  );

  card.appendChild(grid);

  area.appendChild(card);
 });

 calculate();
}

/* SUMMARY CALCULATION */

function calculate(){

 var totalQty=0;
 var totalValue=0;
 var totalTypes=0;

 items.forEach(function(item){

  if(String(item.name).trim()!==""){
   totalTypes++;
  }

  var qty=num(item.baseQty);
  var cost=num(item.baseCost);

  totalQty+=qty;
  totalValue+=qty*cost;
 });

 $("totalTypes").textContent=
  totalTypes+" မျိုး";

 $("totalQty").textContent=
  packet(totalQty);

 $("totalValue").textContent=
  money(totalValue);
}

/* ADD PRODUCT */

$("addBtn").onclick=function(){

 if(!ready||saving)return;

 items.push(fresh());

 changed();
 render();
};

/* LOGIN */

$("loginForm").onsubmit=function(e){

 e.preventDefault();

 var button=this.querySelector("button");
 button.disabled=true;

 $("loginStatus").textContent=
  "Login ဝင်နေပါသည်...";

 auth.signInWithEmailAndPassword(
  $("email").value.trim(),
  $("password").value
 ).then(function(){

  $("password").value="";
  $("loginStatus").textContent="";

 }).catch(function(error){

  $("loginStatus").textContent=
   error.code||error.message;

 }).then(function(){
  button.disabled=false;
 });
};

/* LOAD DATA */

function showCloud(data){

 revision=Number(
  data&&data.revision
 )||0;

 items=normalize(
  data&&data.items
 );

 if(!items.length){
  items=[fresh()];
 }

 ready=true;
 dirty=false;
 conflict=false;

 render();
}

/* FIREBASE AUTH STATE */

auth.onAuthStateChanged(function(user){

 session++;
 var currentSession=session;

 if(unsubscribe){
  unsubscribe();
  unsubscribe=null;
 }

 if(connectionCallback){

  db.ref(".info/connected").off(
   "value",
   connectionCallback
  );

  connectionCallback=null;
 }

 ready=false;
 dirty=false;
 saving=false;
 conflict=false;
 revision=0;

 showConnection(false);

 $("loading").hidden=true;

 if(!user){

  $("loginBox").hidden=false;
  $("appBox").hidden=true;

  return;
 }

 $("loginBox").hidden=true;
 $("appBox").hidden=false;

 $("account").textContent=user.email||"";

 message(
  "Online မူရင်းစာရင်း ဖတ်နေပါသည်..."
 );

 /* FIREBASE CONNECTION */

 connectionCallback=function(snapshot){

  if(session!==currentSession)return;

  showConnection(
   snapshot.val()===true
  );
 };

 db.ref(".info/connected").on(
  "value",
  connectionCallback
 );

 /* CATALOG LISTENER */

 var callback=function(snapshot){

  if(session!==currentSession)return;

  var data=snapshot.val();

  var remote=Number(
   data&&data.revision
  )||0;

  if(!ready){

   showCloud(data);

   message(
    "မူရင်းစာရင်း ရရှိပြီးပါပြီ။"
   );

   return;
  }

  if(saving)return;

  if(dirty){

   if(remote!==revision){

    conflict=true;

    message(
     "အခြားဖုန်းက စာရင်းပြောင်းထားပါသည်။ "+
     "မသိမ်းရသေးသော အချက်အလက်များကို "+
     "သိမ်းထားပြီး Refresh ပြန်လုပ်ပါ။",
     true
    );
   }

   return;
  }

  showCloud(data);
 };

 catalogRef.on(
  "value",
  callback,
  function(error){

   if(session!==currentSession)return;

   message(
    "Database Error: "+
    (error.code||error.message),
    true
   );
  }
 );

 unsubscribe=function(){

  catalogRef.off(
   "value",
   callback
  );
 };

});

/* ONLINE SAVE */

$("saveBtn").onclick=async function(){

 if(saving)return;

 if(!ready||!connected){

  message(
   "Firebase ချိတ်ဆက်မှု စစ်ဆေးပါ။",
   true
  );

  return;
 }

 if(conflict){

  message(
   "အခြားဖုန်းက စာရင်းပြောင်းထားပါသည်။ "+
   "Refresh ပြန်လုပ်ပါ။",
   true
  );

  return;
 }

 /* REMOVE EMPTY PRODUCTS */

 var clean=items.filter(function(x){
  return x.name.trim()!=="";
 });

 /* VALIDATION */

 var names={};

 for(var i=0;i<clean.length;i++){

  var x=clean[i];

  var key=x.name.trim().toLowerCase();

  if(names[key]){

   message(
    "မုန့်အမည် ထပ်နေပါသည်။",
    true
   );
   return;
  }

  names[key]=true;

  var qty=Number(x.baseQty);
  var cost=Number(x.baseCost);

  if(
   !isFinite(qty)||
   qty<0||
   !Number.isInteger(qty)||
   !isFinite(cost)||
   cost<0
  ){

   message(
    "မူရင်းအထုပ်နှင့် မူရင်းဈေးကို စစ်ဆေးပါ။",
    true
   );
   return;
  }
 }

 saving=true;

 $("saveBtn").disabled=true;

 message(
  "Firebase Online Database ထဲ သိမ်းနေပါသည်..."
 );

 var expectedRevision=revision;
 var currentSession=session;

 var payload=JSON.parse(
  JSON.stringify(clean)
 );

 try{

  var result=await catalogRef.transaction(
   function(current){

    var currentRev=Number(
     current&&current.revision
    )||0;

    if(currentRev!==expectedRevision){
     return;
    }

    return {
     revision:currentRev+1,
     items:payload,
     updatedAt:
      firebase.database.ServerValue.TIMESTAMP
    };

   },
   undefined,
   false
  );

  if(currentSession!==session)return;

  if(!result.committed){

   conflict=true;

   message(
    "အခြားဖုန်းက စာရင်းပြောင်းထားသဖြင့် "+
    "Save မလုပ်ခဲ့ပါ။",
    true
   );

  }else{

   showCloud(
    result.snapshot.val()
   );

   message(
    "✓ Save ပြီးပါပြီ။ "+
    "အရောင်း ၁ နှင့် အရောင်း ၂ တွင် "+
    "မုန့်စာရင်း အလိုအလျောက် "+
    "ပြောင်းလဲပေါ်လာပါမည်။"
   );
  }

 }catch(error){

  if(currentSession===session){

   message(
    "Save Error: "+
    (error.code||error.message),
    true
   );
  }

 }finally{

  if(currentSession===session){

   saving=false;
   $("saveBtn").disabled=false;
  }
 }
};

/* UNSAVED DATA WARNING */

window.addEventListener(
 "beforeunload",
 function(e){

  if(dirty){

   e.preventDefault();
   e.returnValue="";
  }
 }
);

})();
</script>

</body>
</html>
