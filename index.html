
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ပင်မ မုန့်စာရင်း</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;padding:15px;background:#f3f6f4;color:#263b32;font-family:Arial,sans-serif}
main{max-width:650px;margin:auto;padding-bottom:90px}
header{background:#176b51;color:white;padding:25px;border-radius:18px;text-align:center;margin-bottom:18px}
header h2{margin:0 0 8px}
.card{background:white;padding:19px;border-radius:18px;margin-bottom:17px;box-shadow:0 4px 15px #0000000d}
.flex{display:flex;justify-content:space-between;align-items:center;gap:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
h3{margin:0 0 15px}
small{color:#66786e;overflow-wrap:anywhere}
label{display:block;margin:13px 0 6px;color:#52645a;font-size:14px}
input{width:100%;min-width:0;padding:13px;border:1px solid #d2ddd6;border-radius:11px;font-size:16px}
button,.link{padding:15px;border:0;border-radius:11px;font-size:15px;font-weight:bold;cursor:pointer}
.primary,.link{background:#176b51;color:white;width:100%}
.link{display:block;text-decoration:none;text-align:center}
.add{border:2px dashed #176b51;background:white;color:#176b51;width:100%}
.del{background:#fff0f0;color:#bd2828}
.status{font-size:14px;color:#176b51;overflow-wrap:anywhere;line-height:1.5}
.error{color:#c62828}
.dot{width:12px;height:12px;border-radius:50%;background:#999;display:inline-block}
.dot.on{background:#13b75c;animation:pulse 1.2s infinite}
.dot.off{background:#c62828}
@keyframes pulse{50%{opacity:.25;box-shadow:0 0 8px #13b75c}100%{opacity:1}}
.summary{background:#176b51;color:white;padding:20px;border-radius:17px}
.line{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #ffffff35}
.line:last-child{border:0}
.sticky{position:sticky;bottom:8px;background:#ffffffef;padding:12px;border-radius:14px;box-shadow:0 3px 15px #0002;margin-top:15px}
button:disabled{opacity:.6}
@media(max-width:360px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header>
<h2>ပင်မ</h2>
မုန့်အမျိုးအစားနှင့် မူရင်းစာရင်း
</header>

<div id="loading" class="card">Firebase ချိတ်ဆက်နေပါသည်...</div>

<div id="loginBox" class="card" hidden>
<h3>ပင်မ Login</h3>
<form id="loginForm">
<label>Email</label><input id="email" type="email" required>
<label>Password</label><input id="password" type="password" required>
<button class="primary" style="margin-top:15px">Login ဝင်မည်</button>
</form>
<p id="loginStatus" class="status"></p>
</div>

<div id="appBox" hidden>
<div class="card">
<div class="flex">
<h3 style="margin:0">ပင်မ မုန့်စာရင်း</h3>
<small id="account" style="text-align:right"></small>
</div>
<p class="flex" style="justify-content:flex-start">
<span id="dot" class="dot"></span>
<strong id="connection">Connecting...</strong>
</p>
<hr style="border:0;border-top:1px solid #e2eae5;margin:18px 0">
<h3>ဘောင်ချာများ ကြည့်ရန်</h3>
<div class="grid">
<a class="link" href="voucher.html?seller=firstseller">အရောင်း ၁</a>
<a class="link" href="voucher.html?seller=secondseller">အရောင်း ၂</a>
</div>
</div>

<div id="items"></div>
<div class="card">
<button id="addBtn" class="add">+ မုန့်အမျိုးအစား ထပ်ထည့်ရန်</button>
</div>

<div class="summary">
<h3>မူရင်းစာရင်းချုပ်</h3>
<div class="line"><span>မုန့်အမျိုးအစား</span><strong id="types">0 မျိုး</strong></div>
<div class="line"><span>မူရင်းအထုပ်စုစုပေါင်း</span><strong id="qty">0 ထုပ်</strong></div>
<div class="line"><span>မူရင်းတန်ဖိုး</span><strong id="value">0 ကျပ်</strong></div>
</div>
<div class="sticky">
<button class="primary" id="saveBtn">💾 Save မည်</button>
<p id="status" class="status"></p>
</div>
</div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
if(!window.firebase){
 $("loading").textContent="Firebase SDK မဖွင့်နိုင်ပါ";
 return;
}
const config={
 apiKey:"AIzaSyAZK7ntdtiSDZ9eC6eAr3xKDK_DGJnNVVU",
 authDomain:"seller-b4dfa.firebaseapp.com",
 databaseURL:"https://seller-b4dfa-default-rtdb.firebaseio.com",
 projectId:"seller-b4dfa",
 storageBucket:"seller-b4dfa.firebasestorage.app",
 messagingSenderId:"632319829206",
 appId:"1:632319829206:web:ae8ea88684ccb061311577"
};
const app=firebase.apps.find(x=>x.name==="mainSellerApp")||
firebase.initializeApp(config,"mainSellerApp");
const auth=app.auth(),db=app.database(),ref=db.ref("catalog");
let items=[],revision=0,ready=false,dirty=false,online=false,saving=false,conflict=false;
let offCatalog=null,offConnection=null;

const id=()=> "p_"+Date.now().toString(36)+Math.random().toString(36).slice(2);
const fresh=()=>({id:id(),name:"",baseQty:"",baseCost:""});
const format=n=>Number(n||0).toLocaleString("en-US");
const normalize=arr=>Array.isArray(arr)?arr.filter(x=>x&&typeof x==="object").map(x=>({
 id:String(x.id||id()),
 name:String(x.name||""),
 baseQty:String(x.baseQty??""),
 baseCost:String(x.baseCost??"")
})):[];
function notify(s,bad=false){
 $("status").textContent=s;
 $("status").className="status"+(bad?" error":"");
}
function changed(){
 dirty=true;
 notify("ပြင်ဆင်ထားပါသည်။ Save နှိပ်ပါ။");
}
function field(item,key,title,type){
 const div=document.createElement("div"),lab=document.createElement("label"),inp=document.createElement("input");
 lab.textContent=title;inp.type=type;inp.value=item[key];
 if(type==="number"){inp.min="0";inp.step=key==="baseQty"?"1":"any"}
 inp.oninput=()=>{item[key]=inp.value;changed();summary()};
 div.append(lab,inp);
 return div;
}
function summary(){
 const valid=items.filter(x=>x.name.trim());
 const qty=valid.reduce((s,x)=>s+Number(x.baseQty||0),0);
 const cost=valid.reduce((s,x)=>s+Number(x.baseQty||0)*Number(x.baseCost||0),0);
 $("types").textContent=valid.length+" မျိုး";
 $("qty").textContent=format(qty)+" ထုပ်";
 $("value").textContent=format(cost)+" ကျပ်";
}
function render(){
 $("items").replaceChildren();
 items.forEach((item,i)=>{
  const card=document.createElement("div");card.className="card";
  const top=document.createElement("div");top.className="flex";
  const title=document.createElement("h3");title.textContent="စဉ် "+(i+1);
  const del=document.createElement("button");del.className="del";del.textContent="ဖျက်ရန်";
  del.onclick=()=>{
   if(!confirm("ဒီမုန့်အမျိုးအစား ဖျက်မလား။"))return;
   items=items.filter(x=>x.id!==item.id);changed();render();
  };
  top.append(title,del);
  const grid=document.createElement("div");grid.className="grid";
  grid.append(field(item,"baseQty","မူရင်းအထုပ်","number"),field(item,"baseCost","တစ်ထုပ်မူရင်းဈေး (ကျပ်)","number"));
  card.append(top,field(item,"name","မုန့်အမျိုးအစား","text"),grid);
  $("items").append(card);
 });
 summary();
}
function load(data){
 revision=Number(data?.revision)||0;
 items=normalize(data?.items);
 if(!items.length)items=[fresh()];
 ready=true;dirty=false;conflict=false;render();
}
$("addBtn").onclick=()=>{if(!ready||saving)return;items.push(fresh());changed();render()};
$("loginForm").onsubmit=async e=>{
 e.preventDefault();
 try{
  await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value);
  $("password").value="";
 }catch(err){$("loginStatus").textContent=err.message}
};
auth.onAuthStateChanged(user=>{
 if(offCatalog)offCatalog();
 if(offConnection)offConnection();
 ready=false;dirty=false;conflict=false;online=false;
 $("loading").hidden=true;
 $("loginBox").hidden=!!user;
 $("appBox").hidden=!user;
 if(!user)return;
 $("account").textContent=user.email||"";
 const onConn=s=>{
  online=s.val()===true;
  $("dot").className="dot "+(online?"on":"off");
  $("connection").textContent=online?"Connected":"Disconnected";
 };
 db.ref(".info/connected").on("value",onConn);
 offConnection=()=>db.ref(".info/connected").off("value",onConn);
 const cb=s=>{
  const data=s.val(),rev=Number(data?.revision)||0;
  if(!ready){load(data);return}
  if(saving)return;
  if(dirty){
   if(rev!==revision){conflict=true;notify("အခြားဖုန်းက စာရင်းပြောင်းထားသည်။ Refresh လုပ်ပါ။",true)}
  }else load(data);
 };
 ref.on("value",cb,e=>notify(e.message,true));
 offCatalog=()=>ref.off("value",cb);
});
$("saveBtn").onclick=async()=>{
 if(saving)return;
 if(!ready||!online||conflict){notify("Connection သို့မဟုတ် စာရင်းအခြေအနေ စစ်ပါ။",true);return}
 const clean=items.filter(x=>x.name.trim());
 const names=new Set();
 for(const x of clean){
  const name=x.name.trim().toLowerCase();
  if(names.has(name)||x.baseQty===""||x.baseCost===""||
   !Number.isInteger(Number(x.baseQty))||Number(x.baseQty)<0||
   !Number.isFinite(Number(x.baseCost))||Number(x.baseCost)<0){
   notify("မုန့်အမည်၊ မူရင်းအထုပ်နှင့် ဈေးကို စစ်ပါ။",true);return;
  }
  names.add(name);
 }
 saving=true;$("saveBtn").disabled=true;
 const rev=revision;
 try{
  const result=await ref.transaction(current=>{
   const r=Number(current?.revision)||0;
   if(r!==rev)return;
   return {revision:r+1,items:clean,updatedAt:firebase.database.ServerValue.TIMESTAMP};
  },undefined,false);
  if(!result.committed){conflict=true;notify("အခြားဖုန်းမှာ စာရင်းပြောင်းထားပါသည်။",true)}
  else{load(result.snapshot.val());notify("✓ Online Save ပြီးပါပြီ။")}
 }catch(e){notify("Save Error: "+e.message,true)}
 finally{saving=false;$("saveBtn").disabled=false}
};
window.addEventListener("beforeunload",e=>{
 if(dirty){e.preventDefault();e.returnValue=""}
});
})();
</script>
</body>
</html>
