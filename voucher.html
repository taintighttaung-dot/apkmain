
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>အရောင်းဘောင်ချာများ</title>

<style>
*{
 box-sizing:border-box;
}
[hidden]{
 display:none!important;
}
body{
 margin:0;
 padding:15px;
 background:#f3f6f4;
 color:#263b32;
 font-family:Arial,sans-serif;
}
.container{
 max-width:650px;
 margin:auto;
 padding-bottom:30px;
}
.header{
 background:#176b51;
 color:white;
 padding:24px 16px;
 border-radius:18px;
 text-align:center;
 margin-bottom:18px;
}
.header h2{
 margin:0 0 8px;
}
.header p{
 margin:0;
 font-size:14px;
}
.card{
 background:white;
 padding:18px;
 border-radius:18px;
 margin-bottom:18px;
 box-shadow:0 4px 15px #0000000d;
}
.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}
h3{
 margin:0 0 14px;
}
label{
 display:block;
 margin:12px 0 7px;
 font-size:14px;
 color:#52645a;
}
input,select{
 width:100%;
 min-width:0;
 padding:13px;
 font-size:16px;
 border:1px solid #d2ddd6;
 border-radius:11px;
 background:white;
 color:#263b32;
}
input:focus,select:focus{
 outline:2px solid #b7ddc8;
}
button,.back{
 display:block;
 padding:14px;
 border:0;
 border-radius:11px;
 font-size:15px;
 font-weight:bold;
 text-decoration:none;
 text-align:center;
 cursor:pointer;
}
.primary{
 width:100%;
 background:#176b51;
 color:white;
}
.back{
 background:#e8f5ee;
 color:#176b51;
 margin-bottom:18px;
}
.status{
 font-size:14px;
 color:#176b51;
 line-height:1.6;
 overflow-wrap:anywhere;
}
.error{
 color:#c62828!important;
}
.small{
 font-size:12px;
 color:#65786d;
 line-height:1.6;
}
.search-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}
.voucher{
 background:white;
 padding:18px;
 border-radius:18px;
 margin-bottom:20px;
 border:1px solid #d6e4da;
 box-shadow:0 3px 12px #0000000a;
}
.voucher-title{
 text-align:center;
 font-size:21px;
 font-weight:bold;
 margin:0 0 17px;
}
.receipt-number{
 text-align:right;
 color:#176b51;
 font-size:13px;
 margin-bottom:12px;
}
.shop{
 background:#e8f5ee;
 border-radius:12px;
 padding:14px;
 margin-bottom:15px;
}
.shop-label{
 display:block;
 color:#52645a;
 font-size:13px;
 margin-bottom:8px;
}
.shop-name{
 font-size:18px;
 font-weight:bold;
 overflow-wrap:anywhere;
}
.info-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}
.info{
 background:#e8f5ee;
 padding:13px;
 border-radius:11px;
 min-width:0;
}
.info small{
 display:block;
 margin-bottom:8px;
 color:#52645a;
}
.info strong{
 font-size:14px;
 overflow-wrap:anywhere;
}
.tablewrap{
 overflow-x:auto;
 margin-top:20px;
}
table{
 border-collapse:collapse;
 width:100%;
 min-width:390px;
 font-size:12px;
 color:#263b32;
}
th,td{
 padding:10px 6px;
 border:1px solid #d4e5db;
 overflow-wrap:anywhere;
}
th{
 background:#e8f5ee;
 font-weight:bold;
}
tfoot{
 background:#e8f5ee;
 font-weight:bold;
}
td:nth-child(n+3){
 text-align:right;
}
.total{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
 padding-top:17px;
 margin-top:18px;
 border-top:1px solid #d4e5db;
 font-weight:bold;
}
.total strong{
 font-size:18px;
 text-align:right;
}
.count{
 background:#e8f5ee;
 color:#176b51;
 padding:7px 11px;
 border-radius:10px;
 font-size:13px;
 font-weight:bold;
}
.empty{
 text-align:center;
 color:#65786d;
 padding:30px 15px;
}
.loading{
 text-align:center;
 padding:24px;
}
@media(max-width:360px){
 .search-grid{
  grid-template-columns:1fr;
 }
 .info-grid{
  gap:8px;
 }
 .voucher{
  padding:13px;
 }
}
</style>
</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="header">

 <h2 id="pageTitle">
  အရောင်းဘောင်ချာများ
 </h2>

 <p>
  သိမ်းဆည်းပြီးသော ဘောင်ချာမှတ်တမ်းများ
 </p>

</div>

<!-- BACK BUTTON -->

<a href="index.html" class="back">
 ပင်မသို့ ပြန်သွားရန်
</a>

<!-- LOADING -->

<div id="loading" class="card loading">
 Firebase ချိတ်ဆက်နေပါသည်...
</div>

<!-- LOGIN -->

<div id="loginBox" class="card" hidden>

 <h3>ပင်မ Account ဖြင့် Login ဝင်ရန်</h3>

 <form id="loginForm">

  <label for="email">Email</label>

  <input
   id="email"
   type="email"
   autocomplete="username"
   required>

  <label for="password">Password</label>

  <input
   id="password"
   type="password"
   autocomplete="current-password"
   required>

  <button
   type="submit"
   class="primary"
   style="margin-top:15px">
   Login ဝင်မည်
  </button>

 </form>

 <p id="loginStatus" class="status"></p>

</div>

<!-- MAIN -->

<div id="appBox" hidden>

<!-- SEARCH -->

<div class="card">

 <div class="top">

  <h3 id="accountTitle">
   အရောင်းဘောင်ချာများ
  </h3>

  <span class="count" id="count">
   0 စောင်
  </span>

 </div>

 <p id="account" class="small"></p>

 <div class="search-grid">

  <div>

   <label for="search">
    ဆိုင်အမည်ဖြင့် ရှာရန်
   </label>

   <input
    id="search"
    type="search"
    placeholder="ဆိုင်အမည် ရိုက်ရှာပါ">

  </div>

  <div>

   <label for="dateSearch">
    ရက်စွဲဖြင့် ရှာရန်
   </label>

   <input
    id="dateSearch"
    type="date">

  </div>

 </div>

 <button id="resetSearch"
  class="back"
  style="width:100%;margin-top:15px">
  ရှာဖွေမှု ရှင်းလင်းရန်
 </button>

</div>

<!-- RECEIPTS -->

<div id="receipts"></div>

<!-- NO RECEIPTS -->

<div id="empty" class="card empty" hidden>
 ဘောင်ချာမှတ်တမ်း မရှိသေးပါ။
</div>

<p id="message" class="status"></p>

</div>

</div>

<!-- FIREBASE SDK -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<script>
(function(){
"use strict";

/* ELEMENT HELPER */

var $=function(id){
 return document.getElementById(id);
};

/* SELLER DETECTION */

var params=new URLSearchParams(
 window.location.search
);

var seller=
 params.get("seller")==="secondseller"
 ? "secondseller"
 : "firstseller";

var sellerTitle=
 seller==="secondseller"
 ? "အရောင်း ၂"
 : "အရောင်း ၁";

$("pageTitle").textContent=
 sellerTitle+" ဘောင်ချာများ";

$("accountTitle").textContent=
 sellerTitle+" ဘောင်ချာမှတ်တမ်း";

document.title=
 sellerTitle+" - ဘောင်ချာများ";

/* FIREBASE CHECK */

if(!window.firebase ||
 !firebase.auth ||
 !firebase.database){

 $("loading").textContent=
  "Firebase SDK မဖွင့်နိုင်ပါ။ Internet စစ်ပါ။";

 return;
}

/* FIREBASE CONFIG */

var firebaseConfig={

 apiKey:
 "AIzaSyAZK7ntdtiSDZ9eC6eAr3xKDK_DGJnNVVU",

 authDomain:
 "seller-b4dfa.firebaseapp.com",

 databaseURL:
 "https://seller-b4dfa-default-rtdb.firebaseio.com",

 projectId:
 "seller-b4dfa",

 storageBucket:
 "seller-b4dfa.firebasestorage.app",

 messagingSenderId:
 "632319829206",

 appId:
 "1:632319829206:web:ae8ea88684ccb061311577"

};

/* INITIALIZE FIREBASE */

var app;

try{

 app=firebase.app("mainSellerApp");

}catch(e){

 app=firebase.initializeApp(
  firebaseConfig,
  "mainSellerApp"
 );

}

var auth=app.auth();
var db=app.database();

/* VARIABLES */

var receipts=[];
var offReceipts=null;
var session=0;

/* FORMAT NUMBER */

function fmt(n){

 var value=Number(n||0);

 return value.toLocaleString(
  "en-US",
  {maximumFractionDigits:2}
 );

}

function money(n){

 return fmt(n)+" ကျပ်";

}

/* DATE FORMAT */

function dateText(timestamp){

 if(!timestamp){
  return "မရှိသေးပါ";
 }

 var date=new Date(Number(timestamp));

 if(isNaN(date.getTime())){
  return "မရှိသေးပါ";
 }

 return date.toLocaleDateString(
  "en-GB",
  {timeZone:"Asia/Yangon"}
 );

}

/* TIME FORMAT */

function timeText(timestamp){

 if(!timestamp){
  return "မရှိသေးပါ";
 }

 var date=new Date(Number(timestamp));

 if(isNaN(date.getTime())){
  return "မရှိသေးပါ";
 }

 return date.toLocaleTimeString(
  "en-US",
  {
   timeZone:"Asia/Yangon",
   hour12:true
  }
 );

}

/* MYANMAR DATE KEY */

function dateKey(timestamp){

 if(!timestamp){
  return "";
 }

 var date=new Date(Number(timestamp));

 if(isNaN(date.getTime())){
  return "";
 }

 // မြန်မာစံတော်ချိန် UTC+06:30
 var myanmarDate=new Date(
  date.getTime()+390*60000
 );

 return myanmarDate
  .toISOString()
  .slice(0,10);

}

/* NORMALIZE SHOP NAME */

function normalizeShop(name){

 return String(name||"")
  .trim()
  .replace(/\s+/g," ")
  .normalize("NFC")
  .toLowerCase();

}

/* CREATE ELEMENT */

function element(tag,text,className){

 var node=document.createElement(tag);

 if(text!==undefined){
  node.textContent=text;
 }

 if(className){
  node.className=className;
 }

 return node;

}

/* PREVENT DUPLICATE RECEIPTS */

/*
 တစ်ရက်တည်း ဆိုင်အမည်တူရင်
 နောက်ဆုံး Save လုပ်ထားသော
 ဘောင်ချာတစ်စောင်သာ ရွေးပြမည်။

 အရောင်း ၁ နှင့် အရောင်း ၂ ကို
 Firebase Path ခွဲထားသဖြင့်
 အချင်းချင်း မရောပါ။
*/

function removeDuplicates(all){

 all.sort(function(a,b){

  return Number(b.savedAt||0)-
   Number(a.savedAt||0);

 });

 var seen={};
 var result=[];

 all.forEach(function(receipt){

  if(!receipt.savedAt){
   return;
  }

  var day=dateKey(
   receipt.savedAt
  );

  var shop=normalizeShop(
   receipt.shopName
  );

  var key=JSON.stringify([
   day,shop
  ]);

  if(!seen[key]){

   seen[key]=true;

   result.push(receipt);

  }

 });

 return result;

}

/* DISPLAY RECEIPT */

function createVoucher(receipt,index){

 var box=element(
  "section",undefined,"voucher"
 );

 var number=element(
  "div",
  "ဘောင်ချာ "+(index+1),
  "receipt-number"
 );

 var title=element(
  "h3",
  "အရောင်းဘောင်ချာ",
  "voucher-title"
 );

 /* SHOP */

 var shop=element(
  "div",undefined,"shop"
 );

 shop.appendChild(
  element(
   "span",
   "ဆိုင်အမည်",
   "shop-label"
  )
 );

 shop.appendChild(
  element(
   "div",
   receipt.shopName||"",
   "shop-name"
  )
 );

 /* DATE AND TIME */

 var infoGrid=element(
  "div",undefined,"info-grid"
 );

 var dateBox=element(
  "div",undefined,"info"
 );

 dateBox.appendChild(
  element(
   "small",
   "ရက်စွဲ"
  )
 );

 dateBox.appendChild(
  element(
   "strong",
   dateText(receipt.savedAt)
  )
 );

 var timeBox=element(
  "div",undefined,"info"
 );

 timeBox.appendChild(
  element(
   "small",
   "အချိန်"
  )
 );

 timeBox.appendChild(
  element(
   "strong",
   timeText(receipt.savedAt)
  )
 );

 infoGrid.appendChild(dateBox);
 infoGrid.appendChild(timeBox);

 /* TABLE */

 var wrap=element(
  "div",undefined,"tablewrap"
 );

 var table=document.createElement("table");

 var thead=document.createElement("thead");

 var headRow=document.createElement("tr");

 [
  "စဉ်",
  "မုန့်အမျိုးအစား",
  "ဦးရေ",
  "နှုန်း",
  "ရောင်းရငွေ"
 ].forEach(function(text){

  headRow.appendChild(
   element("th",text)
  );

 });

 thead.appendChild(headRow);

 /* TABLE BODY */

 var tbody=document.createElement("tbody");

 var rows=Array.isArray(receipt.items)
  ?receipt.items:[];

 rows.forEach(function(item,i){

  var tr=document.createElement("tr");

  var values=[
   String(i+1),
   String(item.name||""),
   fmt(item.qty),
   money(item.rate),
   money(item.revenue)
  ];

  values.forEach(function(value){

   tr.appendChild(
    element("td",value)
   );

  });

  tbody.appendChild(tr);

 });

 /* TABLE FOOTER */

 var tfoot=document.createElement("tfoot");

 var foot=document.createElement("tr");

 var totalLabel=element(
  "td","စုစုပေါင်း"
 );

 totalLabel.colSpan=2;

 foot.appendChild(totalLabel);

 foot.appendChild(
  element(
   "td",
   fmt(receipt.totalQty)
  )
 );

 foot.appendChild(
  element("td","—")
 );

 foot.appendChild(
  element(
   "td",
   money(receipt.totalRevenue)
  )
 );

 tfoot.appendChild(foot);

 table.appendChild(thead);
 table.appendChild(tbody);
 table.appendChild(tfoot);

 wrap.appendChild(table);

 /* TOTAL */

 var total=element(
  "div",undefined,"total"
 );

 total.appendChild(
  element(
   "span",
   "စုစုပေါင်း ရောင်းရငွေ"
  )
 );

 total.appendChild(
  element(
   "strong",
   money(receipt.totalRevenue)
  )
 );

 box.appendChild(number);
 box.appendChild(title);
 box.appendChild(shop);
 box.appendChild(infoGrid);
 box.appendChild(wrap);
 box.appendChild(total);

 return box;

}

/* RENDER ALL RECEIPTS */

function render(){

 var query=normalizeShop(
  $("search").value
 );

 var selectedDate=
  $("dateSearch").value;

 var visible=receipts.filter(function(r){

  var shop=normalizeShop(r.shopName);

  var matchShop=
   shop.indexOf(query)!==-1;

  var matchDate=
   !selectedDate ||
   dateKey(r.savedAt)===selectedDate;

  return matchShop&&matchDate;

 });

 $("receipts").innerHTML="";

 $("count").textContent=
  visible.length+" စောင်";

 $("empty").hidden=
  visible.length>0;

 visible.forEach(function(receipt,index){

  $("receipts").appendChild(
   createVoucher(receipt,index)
  );

 });

}

/* SEARCH */

$("search").oninput=render;

$("dateSearch").onchange=render;

/* RESET SEARCH */

$("resetSearch").onclick=function(){

 $("search").value="";
 $("dateSearch").value="";

 render();

};

/* LOGIN */

$("loginForm").onsubmit=async function(e){

 e.preventDefault();

 var button=this.querySelector("button");

 button.disabled=true;

 $("loginStatus").textContent=
  "Login ဝင်နေပါသည်...";

 try{

  await auth.signInWithEmailAndPassword(
   $("email").value.trim(),
   $("password").value
  );

  $("password").value="";

  $("loginStatus").textContent="";

 }catch(error){

  $("loginStatus").textContent=
   error.message;

 }finally{

  button.disabled=false;

 }

};

/* AUTHENTICATION */

auth.onAuthStateChanged(function(user){

 session++;
 var currentSession=session;

 if(offReceipts){

  offReceipts();
  offReceipts=null;

 }

 receipts=[];

 $("loading").hidden=true;

 $("loginBox").hidden=!!user;
 $("appBox").hidden=!user;

 if(!user){
  return;
 }

 $("account").textContent=
  user.email||"";

 /* MAIN ACCOUNT ONLY */

 if((user.email||"").toLowerCase()
    !=="mainseller@gmail.com"){

  $("message").textContent=
   "ပင်မ Account ဖြင့်သာ ဘောင်ချာကြည့်နိုင်ပါသည်။";

  $("message").className=
   "status error";

  return;

 }

 $("message").textContent=
  "ဘောင်ချာများ ဖတ်နေပါသည်...";

 /* FIREBASE RECEIPTS */

 var ref=db.ref(
  "receipts/"+seller
 );

 var callback=function(snapshot){

  if(currentSession!==session){
   return;
  }

  var all=[];

  snapshot.forEach(function(child){

   var data=child.val();

   if(data&&typeof data==="object"){

    var receipt=Object.assign(
     {id:child.key},
     data
    );

    all.push(receipt);

   }

  });

  /* REMOVE DUPLICATES */

  receipts=removeDuplicates(all);

  $("message").textContent=
   "ဘောင်ချာများ ရရှိပြီးပါပြီ။";

  $("message").className="status";

  render();

 };

 ref.on(
  "value",
  callback,
  function(error){

   if(currentSession!==session){
    return;
   }

   $("message").textContent=
    "Firebase Error: "+
    error.message;

   $("message").className=
    "status error";

  }
 );

 offReceipts=function(){

  ref.off(
   "value",
   callback
  );

 };

});

})();
</script>

</body>
</html>
